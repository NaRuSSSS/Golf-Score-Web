                    map[d.courseName] = (map[d.courseName] || 0) + 1;
                });
                return Object.entries(map).sort((a, b) => b[1] - a[1]).map(entry => ({
                    name: entry[0],
                    count: entry[1]
                }));
            }, [data]);

            const [selectedCourse, setSelectedCourse] = useState(courseCounts[0]?.name || "");

            useEffect(() => {
                if (courseCounts.length > 0 && !courseCounts.find(c => c.name === selectedCourse)) {
                    setSelectedCourse(courseCounts[0].name);
                }
            }, [courseCounts]);

            const [expandedRounds, setExpandedRounds] = useState({});
            const [expandedHalves, setExpandedHalves] = useState({});

            const toggleRound = (idx) => setExpandedRounds(prev => ({...prev, [idx]: !prev[idx]}));
            const toggleHalf = (idx, half) => setExpandedHalves(prev => ({...prev, [`${idx}-${half}`]: !prev[`${idx}-${half}`]}));

            const courseData = useMemo(() => {
                return data.filter(d => d.courseName === selectedCourse).sort((a,b) => new Date(b.date) - new Date(a.date));
            }, [data, selectedCourse]);

            const stats = useMemo(() => {
                const count = courseData.length || 1;
                let puttsCount = 0, fwCount = 0, girCount = 0;
                
                const totals = courseData.reduce((acc, d) => {
                    acc.score += d.score;
                    acc.penalties += d.penalties;
                    acc.bunkers += d.bunkerShots;
                    if (d.putts > 0) { acc.putts += d.putts; puttsCount++; }
                    if (d.fwHit > 0) { acc.fw += d.fwHit; fwCount++; }
                    if (d.gir > 0) { acc.gir += d.gir; girCount++; }
                    return acc;
                }, { score: 0, fw: 0, gir: 0, putts: 0, penalties: 0, bunkers: 0 });

                return {
                    score: (totals.score / count).toFixed(1),
                    rounds: courseData.length,
                    fw: fwCount > 0 ? (totals.fw / fwCount).toFixed(1) : "0.0",
                    gir: girCount > 0 ? (totals.gir / girCount).toFixed(1) : "0.0",
                    putts: puttsCount > 0 ? (totals.putts / puttsCount).toFixed(1) : "0.0",
                    penalties: (totals.penalties / count).toFixed(1),
                    bunkers: (totals.bunkers / count).toFixed(1)
                };
            }, [courseData]);

            const courseStats = useMemo(() => {
                const map = {};
                courseData.forEach(round => {
                    const processHalf = (halfData, holesData) => {
                        const cName = halfData.course || 'Unknown';
                        if (!map[cName]) {
                            map[cName] = { 
                                name: cName, count: 0,
                                par: 0, score: 0, fw: 0, gir: 0, putts: 0, penalty: 0, bunker: 0,
                                holes: Array.from({length: 9}, ()=>({ par:0, score:0, fw:0, gir:0, putts:0, penalty:0, bunker:0, count:0 })) 
                            };
                        }
                        const st = map[cName];
                        st.count += 1;
                        
                        holesData.forEach((h, i) => {
                            if (!h) return;
                            const hSt = st.holes[i];
                            hSt.count += 1;
                            hSt.par += (h.par || 0);
                            hSt.score += (h.score || 0);
                            hSt.putts += (h.putts || 0);
                            hSt.penalty += (h.penalty || 0);
                            hSt.bunker += (h.bunker || 0);
                            if (h.fw === 'Y') hSt.fw += 1;
                            if (h.gir === 'Y') hSt.gir += 1;
                            
                            st.par += (h.par || 0);
                            st.score += (h.score || 0);
                            st.putts += (h.putts || 0);
                            st.penalty += (h.penalty || 0);
                            st.bunker += (h.bunker || 0);
                            if (h.fw === 'Y') st.fw += 1;
                            if (h.gir === 'Y') st.gir += 1;
                        });
                    };
                    
                    if (round.frontHalf) processHalf(round.frontHalf, round.holes.slice(0, 9));
                    if (round.backHalf) processHalf(round.backHalf, round.holes.slice(9, 18));
                });

                return Object.values(map).map(c => {
                    c.avgPar = c.count ? Math.round(c.par / c.count) : 0;
                    c.avgScore = c.count ? (c.score / c.count).toFixed(1) : 0;
                    c.avgFw = c.count ? Math.round((c.fw / (c.count * 7)) * 100) : 0;
                    c.avgGir = c.count ? Math.round((c.gir / (c.count * 9)) * 100) : 0;
                    c.avgPutts = c.count ? (c.putts / c.count).toFixed(1) : 0;
                    c.avgPenalty = c.count ? (c.penalty / c.count).toFixed(1) : 0;
                    c.avgBunker = c.count ? (c.bunker / c.count).toFixed(1) : 0;

                    c.holes = c.holes.map(h => ({
                        par: h.count ? Math.round(h.par / h.count) : 0,
                        score: h.count ? (h.score / h.count).toFixed(1) : 0,
                        fw: h.count ? Math.round((h.fw / h.count) * 100) : 0,
                        gir: h.count ? Math.round((h.gir / h.count) * 100) : 0,
                        putts: h.count ? (h.putts / h.count).toFixed(1) : 0,
                        penalty: h.count ? (h.penalty / h.count).toFixed(1) : 0,
                        bunker: h.count ? (h.bunker / h.count).toFixed(1) : 0,
                    }));
                    return c;
                });
            }, [courseData]);

            const aiInsights = useMemo(() => {
                if (!courseData || courseData.length === 0) return null;

                const holeStats = {};
                const birdieMap = {};

                courseData.forEach(round => {
                    const processHoles = (courseName, holes) => {
                        if(!courseName || courseName.trim() === '') return;
                        holes.forEach((h, i) => {
                            if (!h || !h.par || h.par === 0) return;
                            
                            const relativeHoleNo = i + 1; 
                            const key = `${courseName} ${relativeHoleNo}H`;
                            
                            if (!holeStats[key]) {
                                holeStats[key] = { key, courseName, holeNo: relativeHoleNo, count: 0, par: 0, score: 0, putts: 0, fwHit: 0, fwTotal: 0, girHit: 0, girTotal: 0, penalty: 0, bunker: 0, birdies: 0 };
                            }
                            const stat = holeStats[key];
                            stat.count++;
                            stat.par += h.par;
                            stat.score += h.score;
                            stat.putts += h.putts;
                            stat.penalty += h.penalty;
                            stat.bunker += h.bunker;
                            
                            if (h.score < h.par && h.score > 0) { 
                                stat.birdies++; 
                                if (!birdieMap[courseName]) birdieMap[courseName] = {};
                                birdieMap[courseName][relativeHoleNo] = (birdieMap[courseName][relativeHoleNo] || 0) + 1;
                            }
                            if (h.fw === 'Y' || h.fw === 'N') stat.fwTotal++;
                            if (h.fw === 'Y') stat.fwHit++;
                            if (h.gir === 'Y' || h.gir === 'N') stat.girTotal++;
                            if (h.gir === 'Y') stat.girHit++;
                        });
                    };
                    if (round.frontHalf) processHoles(round.frontHalf.course || round.frontNine, round.holes.slice(0, 9));
                    if (round.backHalf) processHoles(round.backHalf.course || round.backNine, round.holes.slice(9, 18));
                });

                const statsArray = Object.values(holeStats).map(st => {
                    const avgScore = st.score / st.count;
                    const par = st.par / st.count;
                    return {
                        ...st,
                        avgScore,
                        par,
                        overPar: avgScore - par,
                        avgPutts: st.putts / st.count,
                        fwRate: st.fwTotal > 0 ? (st.fwHit / st.fwTotal) * 100 : 0,
                        girRate: st.girTotal > 0 ? (st.girHit / st.girTotal) * 100 : 0,
                        avgPenalty: st.penalty / st.count,
                    };
                }).filter(st => st.count > 0);

                statsArray.sort((a, b) => b.overPar - a.overPar); 

                const worstHoles = statsArray.slice(0, 3);
                const bestHoles = [...statsArray].sort((a, b) => a.overPar - b.overPar).slice(0, 3);

                const generateReason = (st, isWorst) => {
                    const reasons = [];
                    if (isWorst) {
                        if (st.avgPenalty >= 0.5) reasons.push(`벌타(${st.avgPenalty.toFixed(1)}개)`);
                        if (st.fwRate < 40 && st.fwTotal > 0) reasons.push(`F/W(${st.fwRate.toFixed(0)}%)`);
                        if (st.girRate < 30 && st.girTotal > 0) reasons.push(`GIR(${st.girRate.toFixed(0)}%)`);
                        if (st.avgPutts >= 2.2) reasons.push(`퍼트(${st.avgPutts.toFixed(1)}개)`);
                    } else {
                        if (st.girRate >= 60 && st.girTotal > 0) reasons.push(`GIR(${st.girRate.toFixed(0)}%)`);
                        if (st.fwRate >= 70 && st.fwTotal > 0) reasons.push(`F/W(${st.fwRate.toFixed(0)}%)`);
                        if (st.avgPutts <= 1.8) reasons.push(`정밀한 퍼트`);
                    }
                    return reasons.length > 0 ? reasons.join(', ') + (isWorst ? ' 영향' : '로 방어') : (isWorst ? '전반적 샷 난조' : '안정적인 플레이');
                };

                worstHoles.forEach(st => st.reason = generateReason(st, true));
                bestHoles.forEach(st => st.reason = generateReason(st, false));

                const formattedBirdies = Object.keys(birdieMap).sort().map(cName => {
                    const holesObj = birdieMap[cName];
                    const holesStr = Object.keys(holesObj)
                        .map(Number)
                        .sort((a,b) => a - b)
                        .map(hNum => {
                            const cnt = holesObj[hNum];
                            return `${hNum}H${cnt > 1 ? `(${cnt}회)` : ''}`;
                        })
                        .join(', ');
                    return `${cName} : ${holesStr}`;
                });

                let totals = { score: 0, putts: 0, fwHit: 0, fwCount: 0, gir: 0, girCount: 0, penalties: 0, bunkers: 0, ud: 0, udCount: 0 };
                courseData.forEach(d => {
                    totals.score += d.score;
                    if (d.putts > 0) totals.putts += d.putts;
                    if (d.fwHit > 0) { totals.fwHit += d.fwHit; totals.fwCount++; }
                    if (d.gir > 0) { totals.gir += d.gir; totals.girCount++; }
                    if (d.ud > 0) { totals.ud += d.ud; totals.udCount++; }
                    totals.penalties += d.penalties;
                    totals.bunkers += d.bunkerShots;
                });

                const count = courseData.length || 1;
                const crStats = {
                    avgScore: (totals.score / count).toFixed(1),
                    avgPutts: (totals.putts / count).toFixed(1),
                    fwRate: totals.fwCount ? Math.round(totals.fwHit / totals.fwCount) : 0,
                    girRate: totals.girCount ? Math.round(totals.gir / totals.girCount) : 0,
                    udRate: totals.udCount ? Math.round(totals.ud / totals.udCount) : 0,
                    avgPenalty: (totals.penalties / count).toFixed(1)
                };

                let strengths = [];
                let weaknesses = [];
                if (crStats.fwRate >= 55) strengths.push({ title: "안정적인 티샷", desc: `페어웨이 안착률이 ${crStats.fwRate}%로 평균 이상입니다.` });
                if (crStats.girRate >= 40) strengths.push({ title: "날카로운 아이언", desc: `그린 적중률(GIR) ${crStats.girRate}%로 훌륭한 샷 밸런스를 유지합니다.` });
                if (parseFloat(crStats.avgPutts) <= 35) strengths.push({ title: "정교한 퍼팅", desc: `평균 퍼트 수가 ${crStats.avgPutts}개로 준수합니다.` });
                if (parseFloat(crStats.avgPenalty) <= 1.0) strengths.push({ title: "스마트한 코스 매니지먼트", desc: `평균 벌타가 ${crStats.avgPenalty}개 수준으로 영리하게 플레이합니다.` });
                if (crStats.udRate >= 25) strengths.push({ title: "뛰어난 위기 관리", desc: `U/D 성공률이 ${crStats.udRate}%로 매우 우수합니다.` });

                if (crStats.fwRate < 50 && totals.fwCount > 0) weaknesses.push({ title: "티샷 방향성 기복", desc: `페어웨이 안착률(${crStats.fwRate}%)이 아쉽습니다.` });
                if (crStats.girRate < 35 && totals.girCount > 0) weaknesses.push({ title: "아이언 정확도 불안", desc: `그린 적중률(${crStats.girRate}%)이 낮아 숏게임 부담이 큽니다.` });
                if (parseFloat(crStats.avgPutts) >= 36) weaknesses.push({ title: "퍼팅 거리감 아쉬움", desc: `평균 퍼트 수(${crStats.avgPutts}개)가 많아 스코어 손실이 있습니다.` });
                if (parseFloat(crStats.avgPenalty) >= 1.5) weaknesses.push({ title: "페널티 누적", desc: `평균 벌타가 ${crStats.avgPenalty}개로 리스크 관리가 필요합니다.` });
                if (crStats.udRate < 20 && totals.udCount > 0) weaknesses.push({ title: "숏게임 불안", desc: `U/D 성공률(${crStats.udRate}%)이 낮아 파 세이브에 어려움이 있습니다.` });

                if (strengths.length === 0) strengths.push({ title: "무난한 플레이 흐름", desc: "크게 흔들림 없이 안정적인 템포를 유지 중입니다." });
                if (weaknesses.length === 0) weaknesses.push({ title: "기록 유지", desc: "전반적인 지표가 준수합니다. 현재 페이스를 유지하세요." });

                const radarData = [
                    { subject: '정확도(FW)', A: crStats.fwRate || 0, fullMark: 100 },
                    { subject: '아이언(GIR)', A: crStats.girRate || 0, fullMark: 100 },
                    { subject: '스코어', A: Math.max(0, 100 - (parseFloat(crStats.avgScore) - 72) * 2), fullMark: 100 }, 
                    { subject: '안정성(Pen)', A: Math.max(0, 100 - (parseFloat(crStats.avgPenalty) * 15)), fullMark: 100 },
                    { subject: '퍼팅', A: Math.max(0, 100 - (parseFloat(crStats.avgPutts) - 28) * 3), fullMark: 100 }, 
                    { subject: '위기관리(UD)', A: crStats.udRate || 0, fullMark: 100 }
                ];

                return { worstHoles, bestHoles, birdies: formattedBirdies, report: { strengths, weaknesses, radarData } };
            }, [courseData]);

            return (
                <div className="flex flex-col xl:flex-row gap-4 animate-fade-in pb-10">
                    <div className="w-full xl:w-1/2 flex flex-col gap-4">
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-3">
                            <div className="flex items-center gap-2.5">
                                <div className="p-2 bg-emerald-100 text-emerald-600 rounded-xl">
                                    <LucideIcon name="map-pin" className="w-5 h-5" />
                                </div>
                                <h3 className="text-base font-bold text-gray-800">분석할 구장 선택</h3>
                            </div>
                            <select 
                                className="w-full border-2 border-gray-200 rounded-xl px-3 py-1.5 font-bold text-gray-800 text-base focus:ring-emerald-500 focus:border-emerald-500 outline-none bg-gray-50 hover:bg-white transition-colors cursor-pointer"
                                value={selectedCourse}
                                onChange={(e) => setSelectedCourse(e.target.value)}
                            >
                                {courseCounts.map(c => <option key={c.name} value={c.name}>{c.name} ({c.count}회 플레이)</option>)}
                            </select>
                            
                            <div className="grid grid-cols-3 md:grid-cols-6 gap-2 mt-1">
                                <div className="bg-blue-50 rounded-lg py-2 px-1 border border-blue-100 text-center flex flex-col justify-center">
                                    <p className="text-[10px] text-blue-600 font-bold uppercase tracking-tight mb-1">평균 스코어</p>
                                    <p className="text-xl font-black text-blue-700">{stats.score}</p>
                                </div>
                                <div className="bg-teal-50 rounded-lg py-2 px-1 border border-teal-100 text-center flex flex-col justify-center">
                                    <p className="text-[10px] text-teal-600 font-bold uppercase tracking-tight mb-1">평균 F/W</p>
                                    <p className="text-xl font-black text-teal-700">{stats.fw}%</p>
                                </div>
                                <div className="bg-indigo-50 rounded-lg py-2 px-1 border border-indigo-100 text-center flex flex-col justify-center">
                                    <p className="text-[10px] text-indigo-600 font-bold uppercase tracking-tight mb-1">평균 GIR</p>
                                    <p className="text-xl font-black text-indigo-700">{stats.gir}%</p>
                                </div>
                                <div className="bg-orange-50 rounded-lg py-2 px-1 border border-orange-100 text-center flex flex-col justify-center">
                                    <p className="text-[10px] text-orange-600 font-bold uppercase tracking-tight mb-1">평균 퍼트</p>
                                    <p className="text-xl font-black text-orange-700">{stats.putts}</p>
                                </div>
                                <div className="bg-red-50 rounded-lg py-2 px-1 border border-red-100 text-center flex flex-col justify-center">
                                    <p className="text-[10px] text-red-600 font-bold uppercase tracking-tight mb-1">평균 벌타</p>
                                    <p className="text-xl font-black text-red-700">{stats.penalties}</p>
                                </div>
                                <div className="bg-yellow-50 rounded-lg py-2 px-1 border border-yellow-100 text-center flex flex-col justify-center">
                                    <p className="text-[10px] text-yellow-600 font-bold uppercase tracking-tight mb-1">평균 벙커</p>
                                    <p className="text-xl font-black text-yellow-700">{stats.bunkers}</p>
                                </div>
                            </div>
                            
                            {aiInsights && (
                                <div className="mt-2 bg-gradient-to-br from-emerald-50/50 to-teal-50/50 rounded-xl border border-emerald-100/60 p-4">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                                        <div className="bg-white rounded-lg p-3 shadow-sm border border-red-100/60">
                                            <ul className="space-y-2">
                                                {aiInsights.worstHoles.map((h, i) => (
                                                    <li key={i} className="text-[11px] flex justify-between items-start">
                                                        <span className="font-bold text-gray-700 min-w-[70px] leading-tight">{h.key}</span>
                                                        <div className="flex-1 text-right">
                                                            <span className="text-red-500 font-bold block mb-0.5">+{h.overPar.toFixed(1)} 타</span>
                                                            <span className="block text-[9px] text-gray-500 tracking-tight leading-none">{h.reason}</span>
                                                        </div>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                        
                                        <div className="bg-white rounded-lg p-3 shadow-sm border border-blue-100/60">
                                            <ul className="space-y-2">
                                                {aiInsights.bestHoles.map((h, i) => (
                                                    <li key={i} className="text-[11px] flex justify-between items-start">
                                                        <span className="font-bold text-gray-700 min-w-[70px] leading-tight">{h.key}</span>
                                                        <div className="flex-1 text-right">
                                                            <span className="text-blue-500 font-bold block mb-0.5">{h.overPar > 0 ? '+' : ''}{h.overPar.toFixed(1)} 타</span>
                                                            <span className="block text-[9px] text-gray-500 tracking-tight leading-none">{h.reason}</span>
                                                        </div>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>

                                    {aiInsights.birdies.length > 0 && (
                                        <div className="bg-yellow-50 rounded-lg p-3 shadow-sm border border-yellow-200/60 flex items-start gap-2.5 mb-2">
                                            <div className="bg-yellow-200/50 p-1 rounded-md shrink-0">
                                                <LucideIcon name="bird" className="w-4 h-4 text-yellow-700"/>
                                            </div>
                                            <div className="w-full">
                                                <h5 className="text-[11px] font-bold text-yellow-800 mb-0.5">영광의 버디 기록 홀 🏆</h5>
                                                <div className="space-y-0.5">
                                                    {aiInsights.birdies.map((line, bIdx) => (
                                                        <p key={bIdx} className="text-[11px] text-yellow-700/90 font-bold whitespace-nowrap overflow-hidden text-ellipsis">
                                                            {line}
                                                        </p>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3 border-t border-emerald-200/60 pt-3">
                                        <div className="bg-white p-3 rounded-lg shadow-sm border border-indigo-100/60 flex flex-col items-center h-[240px]">
                                            <h3 className="w-full text-[11px] font-bold text-gray-800 mb-1 flex items-center gap-1.5">
                                                <LucideIcon name="hexagon" className="w-3.5 h-3.5 text-indigo-500" />
                                                플레이 밸런스 분석
                                            </h3>
                                            <ResponsiveContainer width="100%" height="100%">
                                                <RadarChart cx="50%" cy="50%" outerRadius="60%" data={aiInsights.report.radarData}>
                                                    <PolarGrid stroke="#e2e8f0" />
                                                    <PolarAngleAxis dataKey="subject" tick={{ fill: '#64748b', fontSize: 9, fontWeight: 'bold' }} />
                                                    <PolarRadiusAxis angle={30} domain={[0, 100]} tick={false} axisLine={false} />
                                                    <Radar name="능력치" dataKey="A" stroke="#10b981" fill="#34d399" fillOpacity={0.5} />
                                                </RadarChart>
                                            </ResponsiveContainer>
                                        </div>
                                        
                                        <div className="flex flex-col gap-3 h-[240px] overflow-y-auto custom-scrollbar">
                                            <div className="bg-white p-3 rounded-lg shadow-sm border border-emerald-100/60">
                                                <h3 className="text-[11px] font-bold text-emerald-600 mb-2 flex items-center gap-1.5 border-b border-emerald-50 pb-1">
                                                    <LucideIcon name="thumbs-up" className="w-3.5 h-3.5" /> 주요 성과 및 강점
                                                </h3>
                                                <div className="space-y-2">
                                                    {aiInsights.report.strengths.slice(0, 3).map((item, idx) => (
                                                        <div key={idx} className="flex gap-1.5 items-start">
                                                            <LucideIcon name="check" className="w-3 h-3 text-emerald-500 shrink-0 mt-0.5" />
                                                            <div>
                                                                <h4 className="text-[10px] font-bold text-gray-800 leading-tight">{item.title}</h4>
                                                                <p className="text-[9px] text-gray-500 mt-0.5 leading-snug">{item.desc}</p>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            
                                            <div className="bg-white p-3 rounded-lg shadow-sm border border-red-100/60">
                                                <h3 className="text-[11px] font-bold text-red-500 mb-2 flex items-center gap-1.5 border-b border-red-50 pb-1">
                                                    <LucideIcon name="alert-triangle" className="w-3.5 h-3.5" /> 취약점 및 개선 분석
                                                </h3>
                                                <div className="space-y-2">
                                                    {aiInsights.report.weaknesses.slice(0, 3).map((item, idx) => (

                                                            const isLoss = m.myScore > m.partnerScore;
                                                            return (
                                                                <tr key={`r-${idx}`} className="hover:bg-indigo-50/30 transition-colors">
                                                                    <td className="w-[22%] px-2 py-2 text-gray-400 tracking-tighter whitespace-nowrap">{m.date.substring(2)}</td>
                                                                    <td className="w-[36%] px-2 py-2 font-bold text-gray-700 truncate">{m.course}</td>
                                                                    <td className={`w-[11%] px-2 py-2 text-center font-black ${isWin ? 'text-blue-600' : 'text-gray-500'}`}>{m.myScore}</td>
                                                                    <td className="w-[20%] px-2 py-2 text-center">
                                                                        {isWin && <span className="inline-block px-1.5 py-0.5 bg-blue-50 text-blue-600 border border-blue-100 rounded text-[9px] font-black tracking-wider">WIN</span>}
                                                                        {isLoss && <span className="inline-block px-1.5 py-0.5 bg-red-50 text-red-500 border border-red-100 rounded text-[9px] font-black tracking-wider">LOSS</span>}
                                                                        {!isWin && !isLoss && <span className="inline-block px-1.5 py-0.5 bg-gray-100 text-gray-500 border border-gray-200 rounded text-[9px] font-black tracking-wider">TIE</span>}
                                                                    </td>
                                                                    <td className={`w-[11%] px-2 py-2 text-center font-bold ${isLoss ? 'text-red-500' : 'text-gray-400'}`}>{m.partnerScore}</td>
                                                                </tr>
                                                            )
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="flex flex-col items-center justify-center h-full text-gray-400 bg-white rounded-3xl border border-gray-100 shadow-sm min-h-[500px]">
                                <LucideIcon name="ghost" className="w-12 h-12 mb-3 text-gray-300" />
                                <p>동반자 데이터가 없습니다.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const HoleTable = ({ holes }) => {
            return (
                <div className="overflow-x-auto rounded-xl border border-gray-200 bg-white shadow-sm">
                    <table className="w-full text-center border-collapse">
                        <thead>
                            <tr className="bg-slate-100 text-slate-600 font-medium text-[11px] uppercase tracking-wider">
                                <th className="p-1 sm:p-2 border-r border-b text-left pl-2 sm:pl-3 w-10 sm:w-14 whitespace-nowrap">Hole</th>
                                {holes.map((h, i) => <th key={`h-${i}`} className="p-1 sm:p-2 border-r border-b w-6 sm:w-8 whitespace-nowrap">{h.holeNo}</th>)}
                            </tr>
                        </thead>
                        <tbody className="text-[10px] sm:text-[11px]">
                            <tr>
                                <td className="p-1 sm:p-1.5 border-r border-b font-medium text-slate-500 text-left pl-2 sm:pl-3 bg-slate-50 whitespace-nowrap">Par</td>
                                {holes.map((h, i) => <td key={`p-${i}`} className="p-1 sm:p-1.5 border-r border-b bg-slate-50 whitespace-nowrap">{h.par}</td>)}
                            </tr>
                            <tr>
                                <td className="p-1 sm:p-1.5 border-r border-b font-semibold text-blue-600 text-left pl-2 sm:pl-3 bg-blue-50/30 whitespace-nowrap">Score</td>
                                {holes.map((h, i) => {
                                    const isBirdie = h.score < h.par && h.score > 0;
                                    const isBogey = h.score > h.par;
                                    return (
                                        <td key={`s-${i}`} className={`p-1 sm:p-1.5 border-r border-b font-bold bg-blue-50/30 whitespace-nowrap ${isBirdie ? 'text-red-500' : isBogey ? 'text-blue-600' : 'text-gray-700'}`}>
                                            {h.score}
                                        </td>
                                    )
                                })}
                            </tr>
                            <tr>
                                <td className="p-1 sm:p-1.5 border-r border-b text-slate-500 text-left pl-2 sm:pl-3 whitespace-nowrap">Putts</td>
                                {holes.map((h, i) => <td key={`pu-${i}`} className="p-1 sm:p-1.5 border-r border-b text-gray-600 font-medium whitespace-nowrap">{h.putts || '-'}</td>)}
                            </tr>
                            <tr>
                                <td className="p-1 sm:p-1.5 border-r border-b text-slate-500 text-left pl-2 sm:pl-3 whitespace-nowrap">F/W</td>
                                {holes.map((h, i) => (
                                    <td key={`fw-${i}`} className={`p-1 sm:p-1.5 border-r border-b font-bold whitespace-nowrap ${h.fw==='Y'?'text-emerald-500':h.fw==='N'?'text-gray-300':''}`}>
                                        {h.fw}
                                    </td>
                                ))}
                            </tr>
                            <tr>
                                <td className="p-1 sm:p-1.5 border-r border-b text-slate-500 text-left pl-2 sm:pl-3 whitespace-nowrap">GIR</td>
                                {holes.map((h, i) => (
                                    <td key={`g-${i}`} className={`p-1 sm:p-1.5 border-r border-b font-bold whitespace-nowrap ${h.gir==='Y'?'text-indigo-500':h.gir==='N'?'text-gray-300':''}`}>
                                        {h.gir}
                                    </td>
                                ))}
                            </tr>
                            <tr>
                                <td className="p-1 sm:p-1.5 border-r border-b text-slate-500 text-left pl-2 sm:pl-3 whitespace-nowrap">Penalty</td>
                                {holes.map((h, i) => (
                                    <td key={`pe-${i}`} className={`p-1 sm:p-1.5 border-r border-b whitespace-nowrap ${h.penalty > 0 ? 'text-red-500 font-bold' : 'text-gray-200'}`}>
                                        {h.penalty > 0 ? h.penalty : '-'}
                                    </td>
                                ))}
                            </tr>
                            <tr>
                                <td className="p-1 sm:p-1.5 border-r text-slate-500 text-left pl-2 sm:pl-3 whitespace-nowrap">Bunker</td>
                                {holes.map((h, i) => (
                                    <td key={`b-${i}`} className={`p-1 sm:p-1.5 border-r whitespace-nowrap ${h.bunker > 0 ? 'text-yellow-600 font-bold' : 'text-gray-200'}`}>
                                        {h.bunker > 0 ? h.bunker : '-'}
                                    </td>
                                ))}
                            </tr>
                        </tbody>
                    </table>
                </div>
            );
        };

        const StatCard = ({ title, value, suffix, color }) => {
            const colorMap = {
                blue: 'text-blue-600 bg-blue-50 border-blue-100',
                emerald: 'text-emerald-600 bg-emerald-50 border-emerald-100',
                indigo: 'text-indigo-600 bg-indigo-50 border-indigo-100',
                orange: 'text-orange-600 bg-orange-50 border-orange-100',
                purple: 'text-purple-600 bg-purple-50 border-purple-100'
            };
            const selectedStyle = colorMap[color] || colorMap.blue;
            return (
                <div className={`py-3 px-4 rounded-xl shadow-sm border ${selectedStyle} flex flex-col items-center justify-center text-center h-[70px]`}>
                    <p className="text-[10px] font-bold uppercase tracking-wider mb-0.5 opacity-70">{title}</p>
                    <p className="text-xl font-black leading-none">
                        {value} <span className="text-[10px] font-medium opacity-60 ml-0.5">{suffix}</span>
                    </p>
                </div>
            );
        };

        const ReportTab = ({ data }) => {
            const years = useMemo(() => {
                return [...new Set(data.map(d => d.year))].filter(y => y && !isNaN(y) && parseInt(y) > 2000).sort((a,b)=> b-a);
            }, [data]);

            const [selectedYear, setSelectedYear] = useState(years.length > 0 ? years[0] : 'all');

            const reportData = useMemo(() => {
                const filtered = selectedYear === 'all' ? data : data.filter(d => d.year === selectedYear);
                if (filtered.length === 0) return null;

                let totals = { score: 0, putts: 0, fwHit: 0, fwCount: 0, gir: 0, girCount: 0, penalties: 0, bunkers: 0, ud: 0, udCount: 0, par3Score: 0, par3Par: 0, par4Score: 0, par4Par: 0, par5Score: 0, par5Par: 0 };
                let bestScore = 999;
                let worstScore = 0;
                let subPars = 0, pars = 0, bogeys = 0, doublePlus = 0;

                filtered.forEach(d => {
                    totals.score += d.score;
                    if (d.score < bestScore) bestScore = d.score;
                    if (d.score > worstScore) worstScore = d.score;
                    
                    if (d.putts > 0) totals.putts += d.putts;
                    if (d.fwHit > 0) { totals.fwHit += d.fwHit; totals.fwCount++; }
                    if (d.gir > 0) { totals.gir += d.gir; totals.girCount++; }
                    if (d.ud > 0) { totals.ud += d.ud; totals.udCount++; }
                    totals.penalties += d.penalties;
                    totals.bunkers += d.bunkerShots;

                    d.holes.forEach(h => {
                        if (h.par === 0) return;
                        if (h.par === 3) { totals.par3Score += h.score; totals.par3Par += h.par; }
                        else if (h.par === 4) { totals.par4Score += h.score; totals.par4Par += h.par; }
                        else if (h.par === 5) { totals.par5Score += h.score; totals.par5Par += h.par; }

                        const diff = h.score - h.par;
                        if (diff < 0) subPars++;
                        else if (diff === 0) pars++;
                        else if (diff === 1) bogeys++;
                        else if (diff >= 2) doublePlus++;
                    });
                });

                const count = filtered.length;
                const totalHoles = subPars + pars + bogeys + doublePlus || 1;

                const stats = {
                    rounds: count,
                    avgScore: (totals.score / count).toFixed(1),
                    bestScore: bestScore === 999 ? '-' : bestScore,
                    worstScore: worstScore === 0 ? '-' : worstScore,
                    avgPutts: (totals.putts / count).toFixed(1),
                    fwRate: totals.fwCount ? Math.round(totals.fwHit / totals.fwCount) : 0,
                    girRate: totals.girCount ? Math.round(totals.gir / totals.girCount) : 0,
                    udRate: totals.udCount ? Math.round(totals.ud / totals.udCount) : 0,
                    avgPenalty: (totals.penalties / count).toFixed(1),
                    avgBunker: (totals.bunkers / count).toFixed(1),
                    par3Avg: totals.par3Par ? '+' + ((totals.par3Score - totals.par3Par) / (totals.par3Par/3)).toFixed(1) : '-',
                    par4Avg: totals.par4Par ? '+' + ((totals.par4Score - totals.par4Par) / (totals.par4Par/4)).toFixed(1) : '-',
                    par5Avg: totals.par5Par ? '+' + ((totals.par5Score - totals.par5Par) / (totals.par5Par/5)).toFixed(1) : '-',
                    parRate: Math.round(((subPars + pars) / totalHoles) * 100),
                    bogeyRate: Math.round((bogeys / totalHoles) * 100),
                    doubleRate: Math.round((doublePlus / totalHoles) * 100)
                };

                let strengths = [];
                let weaknesses = [];
                let strategies = [];

                if (stats.fwRate >= 55) strengths.push({ title: "안정적인 티샷", desc: `페어웨이 안착률이 ${stats.fwRate}%로 평균 이상입니다. 세컨드 샷을 유리한 위치에서 시작하여 스코어 방어에 큰 기여를 하고 있습니다.` });
                if (stats.girRate >= 40) strengths.push({ title: "날카로운 아이언", desc: `그린 적중률(GIR) ${stats.girRate}%로 훌륭한 샷 밸런스를 유지하고 있습니다. 버디와 파 찬스를 꾸준히 만들어냅니다.` });
                if (parseFloat(stats.avgPutts) <= 35) strengths.push({ title: "정교한 퍼팅", desc: `평균 퍼트 수가 ${stats.avgPutts}개로 그린 위에서의 집중력이 뛰어납니다. 쓰리 퍼트를 효과적으로 억제하고 있습니다.` });
                if (parseFloat(stats.avgPenalty) <= 1.0) strengths.push({ title: "스마트한 코스 매니지먼트", desc: `라운드 당 평균 벌타가 ${stats.avgPenalty}개 수준으로, 리스크를 잘 관리하는 영리한 플레이를 보여줍니다.` });
                if (stats.udRate >= 25) strengths.push({ title: "뛰어난 위기 관리 (U/D)", desc: `그린을 놓쳤을 때 파로 막아내는 U/D 성공률이 ${stats.udRate}%로 매우 우수합니다. 어프로치와 숏게임이 강력한 무기입니다.` });

                if (stats.fwRate < 50 && totals.fwCount > 0) weaknesses.push({ title: "티샷 방향성 기복", desc: `페어웨이 안착률(${stats.fwRate}%)이 다소 아쉽습니다. 트러블 상황에서의 세컨드 샷 비중이 높아 스코어 손실이 누적됩니다.` });
                if (stats.girRate < 35 && totals.girCount > 0) weaknesses.push({ title: "아이언 정확도 및 세컨드 샷 불안", desc: `그린 적중률(${stats.girRate}%)이 낮아 숏게임(어프로치)에 대한 의존도와 압박감이 매우 높습니다.` });
                if (parseFloat(stats.avgPutts) >= 36) weaknesses.push({ title: "퍼팅 거리감 및 숏퍼트 미스", desc: `평균 퍼트 수(${stats.avgPutts}개)가 많습니다. 첫 퍼트의 거리감 부족이 쓰리 퍼트로 이어지거나 1~2m 숏퍼트 미스가 잦은 것으로 보입니다.` });
                if (parseFloat(stats.avgPenalty) >= 1.5) weaknesses.push({ title: "코스 매니지먼트 및 페널티 누적", desc: `평균 벌타가 ${stats.avgPenalty}개로 스코어 상승의 주된 원인입니다. 공격적인 에이밍이나 무리한 세컨드 샷 시도가 원인일 수 있습니다.` });
                if (stats.udRate < 20 && totals.udCount > 0) weaknesses.push({ title: "그린 주변 숏게임(U/D) 불안", desc: `U/D 성공률(${stats.udRate}%)이 낮습니다. 그린 주변에서 파 세이브를 하지 못해 보기가 더블 보기로 무너지는 흐름이 나옵니다.` });
                if (parseFloat(stats.avgBunker) >= 3.0) weaknesses.push({ title: "벙커 기피 현상 및 탈출 실패", desc: `평균 벙커샷이 ${stats.avgBunker}회로 잦습니다. 벙커에 자주 빠지거나 한 번에 탈출하지 못해 타수를 잃고 있습니다.` });

                if (strengths.length === 0) strengths.push({ title: "무난한 플레이 흐름", desc: "전체적으로 크게 흔들림 없이 안정적인 템포를 유지하며 라운딩을 소화하고 있습니다." });
                if (weaknesses.length === 0) weaknesses.push({ title: "숏게임 집중력 저하", desc: "전반적인 샷 지표는 준수하나, 스코어를 극적으로 줄이기 위해서는 30m 이내 어프로치와 퍼팅 퀄리티를 한 단계 높여야 합니다." });

                if (stats.girRate < 35) strategies.push("100~130m 이내의 숏아이언/웨지 컨트롤 샷 연습량을 늘려 그린 적중률(GIR)을 방어하세요.");
                if (parseFloat(stats.avgPutts) >= 36) strategies.push("라운드 전 연습그린에서 반드시 10~15보 롱퍼트 거리감 맞추기와 1.5m 숏퍼트 집중력 연습에 15분 이상 투자하세요.");
                if (stats.udRate < 20 && totals.udCount > 0) strategies.push("그린 주변 10~20m 어프로치 시, 공을 무리하게 띄우기보다는 런닝 어프로치(피치앤런) 비율을 높여 홀에 붙일 확률을 높이세요.");
                if (stats.fwRate < 50) strategies.push("드라이버 비거리에 대한 욕심을 버리고, 80%의 스윙 크기로 페어웨이를 지키는 '컨트롤 티샷' 전략을 실전에서 테스트해 보세요.");
                if (parseFloat(stats.avgPenalty) >= 1.5) strategies.push("위험 구역(OB/해저드)이 있는 홀에서는 무조건 넓은 쪽이나 안전한 벙커 방향을 에이밍하는 보수적인 코스 매니지먼트를 적용하세요.");
                if (parseFloat(stats.avgBunker) >= 3.0) strategies.push("세컨드 샷 에이밍 시 핀을 직접 노리기보다 벙커를 피하는 안전한 구역(그린 중앙)을 최우선 타겟으로 삼으세요.");
                if (strategies.length < 3) strategies.push("파3 홀에서의 티샷 정확도를 높이고, 파4 홀에서는 무리한 2온보다는 안전한 3온 1퍼트 전략을 적절히 섞어 운영해 보세요.");
                
                const radarData = [
                    { subject: '정확도(FW)', A: stats.fwRate || 0, fullMark: 100 },
                    { subject: '아이언(GIR)', A: stats.girRate || 0, fullMark: 100 },
                    { subject: '스코어', A: Math.max(0, 100 - (parseFloat(stats.avgScore) - 72) * 2), fullMark: 100 }, 
                    { subject: '안정성(Penalty)', A: Math.max(0, 100 - (parseFloat(stats.avgPenalty) * 15)), fullMark: 100 },
                    { subject: '퍼팅', A: Math.max(0, 100 - (parseFloat(stats.avgPutts) - 28) * 3), fullMark: 100 }, 
                    { subject: '위기관리(U/D)', A: stats.udRate || 0, fullMark: 100 }
                ];

                return { stats, strengths, weaknesses, strategies, radarData };
            }, [data, selectedYear]);

            if (!reportData) return <div className="text-center p-10 text-gray-500">해당 연도의 데이터가 없습니다.</div>;

            return (
                <div className="space-y-6 animate-fade-in pb-10 max-w-6xl mx-auto">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <div>
                            <h2 className="text-xl font-black text-gray-800 flex items-center gap-2">
                                <LucideIcon name="clipboard-check" className="w-6 h-6 text-emerald-500" />
                                {selectedYear === 'all' ? '전체 기간' : `${selectedYear}년`} 골프 종합 분석 보고서
                            </h2>
                            <p className="text-xs text-gray-500 mt-1">AI가 고객님의 데이터를 다각도로 분석하여 작성한 리포트입니다.</p>
                        </div>
                        <select 
                            className="border border-gray-200 rounded-xl px-4 py-2 font-bold text-sm text-gray-800 focus:ring-emerald-500 focus:border-emerald-500 bg-gray-50 hover:bg-white transition-colors cursor-pointer"
                            value={selectedYear}
                            onChange={(e) => setSelectedYear(e.target.value)}
                        >
                            <option value="all">전체 연도</option>
                            {years.map(y => <option key={y} value={y}>{y}년</option>)}
                        </select>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-5 text-white shadow-md relative overflow-hidden">
                            <div className="absolute right-[-10px] top-[-10px] opacity-10">
                                <LucideIcon name="flag" className="w-24 h-24" />
                            </div>
                            <p className="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1 relative z-10">총 라운드</p>
                            <p className="text-3xl font-black relative z-10">{reportData.stats.rounds}<span className="text-sm font-normal text-slate-300 ml-1">회</span></p>
                        </div>
                        <div className="bg-gradient-to-br from-blue-500 to-blue-700 rounded-2xl p-5 text-white shadow-md relative overflow-hidden">
                            <div className="absolute right-[-10px] top-[-10px] opacity-10">
                                <LucideIcon name="target" className="w-24 h-24" />
                            </div>
                            <p className="text-blue-200 text-xs font-bold uppercase tracking-wider mb-1 relative z-10">평균 스코어</p>
                            <p className="text-3xl font-black relative z-10">{reportData.stats.avgScore}<span className="text-sm font-normal text-blue-200 ml-1">타</span></p>
                        </div>
                        <div className="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl p-5 text-white shadow-md relative overflow-hidden">
                            <div className="absolute right-[-10px] top-[-10px] opacity-10">
                                <LucideIcon name="award" className="w-24 h-24" />
                            </div>
                            <p className="text-emerald-200 text-xs font-bold uppercase tracking-wider mb-1 relative z-10">시즌 베스트</p>
                            <p className="text-3xl font-black relative z-10">{reportData.stats.bestScore}<span className="text-sm font-normal text-emerald-200 ml-1">타</span></p>
                        </div>
                        <div className="bg-gradient-to-br from-orange-400 to-red-500 rounded-2xl p-5 text-white shadow-md relative overflow-hidden">
                            <div className="absolute right-[-10px] top-[-10px] opacity-10">
                                <LucideIcon name="trending-down" className="w-24 h-24" />
                            </div>
                            <p className="text-orange-200 text-xs font-bold uppercase tracking-wider mb-1 relative z-10">평균 퍼트수</p>
                            <p className="text-3xl font-black relative z-10">{reportData.stats.avgPutts}<span className="text-sm font-normal text-orange-200 ml-1">개</span></p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-1 space-y-6">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center h-[320px]">
                                <h3 className="w-full text-sm font-bold text-gray-800 mb-2 flex items-center gap-2">
                                    <LucideIcon name="hexagon" className="w-4 h-4 text-indigo-500" />
                                    플레이 밸런스 분석
                                </h3>
                                <ResponsiveContainer width="100%" height="100%">
                                    <RadarChart cx="50%" cy="50%" outerRadius="70%" data={reportData.radarData}>
                                        <PolarGrid stroke="#e2e8f0" />
                                        <PolarAngleAxis dataKey="subject" tick={{ fill: '#64748b', fontSize: 11, fontWeight: 'bold' }} />
                                        <PolarRadiusAxis angle={30} domain={[0, 100]} tick={false} axisLine={false} />
                                        <Radar name="능력치" dataKey="A" stroke="#10b981" fill="#34d399" fillOpacity={0.5} />
                                    </RadarChart>
                                </ResponsiveContainer>
                            </div>

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                <h3 className="text-sm font-bold text-gray-800 mb-4 flex items-center gap-2">
                                    <LucideIcon name="pie-chart" className="w-4 h-4 text-blue-500" />
                                    홀별 스코어 분포도
                                </h3>
                                <div className="space-y-3">
                                    <div>
                                        <div className="flex justify-between text-[11px] font-bold mb-1">
                                            <span className="text-emerald-600">파 이하 (Par or Better)</span>
                                            <span className="text-emerald-700">{reportData.stats.parRate}%</span>
                                        </div>
                                        <div className="w-full bg-gray-100 rounded-full h-2">
                                            <div className="bg-emerald-500 h-2 rounded-full" style={{ width: `${reportData.stats.parRate}%` }}></div>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-[11px] font-bold mb-1">
                                            <span className="text-blue-600">보기 (Bogey)</span>
                                            <span className="text-blue-700">{reportData.stats.bogeyRate}%</span>
                                        </div>
                                        <div className="w-full bg-gray-100 rounded-full h-2">
                                            <div className="bg-blue-500 h-2 rounded-full" style={{ width: `${reportData.stats.bogeyRate}%` }}></div>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-[11px] font-bold mb-1">
                                            <span className="text-red-500">더블 보기 이상 (Double+)</span>
                                            <span className="text-red-600">{reportData.stats.doubleRate}%</span>
                                        </div>
                                        <div className="w-full bg-gray-100 rounded-full h-2">
                                            <div className="bg-red-500 h-2 rounded-full" style={{ width: `${reportData.stats.doubleRate}%` }}></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-2 space-y-6">
                            
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                <h3 className="text-base font-black text-emerald-600 mb-4 flex items-center gap-2 border-b border-emerald-100 pb-3">
                                    <LucideIcon name="thumbs-up" className="w-5 h-5" />
                                    주요 성과 및 강점
                                </h3>
                                <div className="space-y-4">
                                    {reportData.strengths.map((item, idx) => (
                                        <div key={idx} className="flex gap-3 items-start">
                                            <div className="mt-0.5 bg-emerald-100 p-1.5 rounded-lg shrink-0">
                                                <LucideIcon name="check" className="w-4 h-4 text-emerald-600" />
                                            </div>
                                            <div>
                                                <h4 className="text-sm font-bold text-gray-800">{item.title}</h4>
                                                <p className="text-[13px] text-gray-600 mt-1 leading-relaxed">{item.desc}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                <h3 className="text-base font-black text-red-500 mb-4 flex items-center gap-2 border-b border-red-100 pb-3">
                                    <LucideIcon name="alert-triangle" className="w-5 h-5" />
                                    취약점 및 개선 분석
                                </h3>
                                <div className="space-y-4">
                                    {reportData.weaknesses.map((item, idx) => (
                                        <div key={idx} className="flex gap-3 items-start">
                                            <div className="mt-0.5 bg-red-100 p-1.5 rounded-lg shrink-0">
                                                <LucideIcon name="trending-down" className="w-4 h-4 text-red-600" />
                                            </div>
                                            <div>
                                                <h4 className="text-sm font-bold text-gray-800">{item.title}</h4>
                                                <p className="text-[13px] text-gray-600 mt-1 leading-relaxed">{item.desc}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                <h3 className="text-base font-black text-indigo-600 mb-4 flex items-center gap-2 border-b border-indigo-100 pb-3">
                                    <LucideIcon name="lightbulb" className="w-5 h-5" />
                                    핵심 훈련 전략 및 조언
                                </h3>
                                <ul className="space-y-3">
                                    {reportData.strategies.map((strategy, idx) => (
                                        <li key={idx} className="flex gap-3 items-start bg-indigo-50/50 p-3 rounded-xl border border-indigo-50">
                                            <span className="text-indigo-500 font-black text-sm">{idx + 1}.</span>
                                            <p className="text-[13px] text-gray-700 leading-relaxed font-medium">{strategy}</p>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            <div className="grid grid-cols-3 gap-4">
                                <div className="bg-gray-50 p-4 rounded-xl border border-gray-100 text-center">
                                    <p className="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1">Par 3 평균 오버파</p>
                                    <p className="text-lg font-black text-gray-800">{reportData.stats.par3Avg}</p>
                                </div>
                                <div className="bg-gray-50 p-4 rounded-xl border border-gray-100 text-center">
                                    <p className="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1">Par 4 평균 오버파</p>
                                    <p className="text-lg font-black text-gray-800">{reportData.stats.par4Avg}</p>
                                </div>
                                <div className="bg-gray-50 p-4 rounded-xl border border-gray-100 text-center">
                                    <p className="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1">Par 5 평균 오버파</p>
                                    <p className="text-lg font-black text-gray-800">{reportData.stats.par5Avg}</p>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
